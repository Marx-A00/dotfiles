# Termux config for the BOOX Tab Ultra C — deployed by boox/deploy.sh.
# Reload on-device with: termux-reload-settings

# Emacs-friendly extra-keys rows (ESC/CTRL/ALT reachable without gymnastics)
extra-keys = [ \
  ['ESC','/','-','HOME','UP','END','PGUP','DEL'], \
  ['TAB','CTRL','ALT','LEFT','DOWN','RIGHT','PGDN','ENTER'] \
]

# Bigger touch targets on a 10.3" panel
extra-keys-text-all-caps = false

# Bell is a full-panel eyesore on e-ink
bell-character = ignore
